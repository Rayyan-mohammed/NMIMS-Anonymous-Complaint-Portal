<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - NMIMS University Complaint Portal</title>
    <link rel="stylesheet" href="admin-dashboard.css">
    <style>
        /* Basic Styles */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #c1272d;
            padding: 10px 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .navbar-logo img {
            height: 50px;
        }

        .logout a {
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            border: 1px solid white;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .logout a:hover {
            background-color: white;
            color: #003366;
        }

        .dashboard-container {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .complaint-list {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }

        .complaint-item {
            border-bottom: 1px solid #ddd;
            padding: 15px 0;
        }

        .complaint-item:last-child {
            border-bottom: none;
        }

        .complaint-item h3 {
            margin: 0;
            color: #c1272d;
        }

        .complaint-item p {
            margin: 5px 0;
        }

        .status {
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        .status.pending {
            background-color: #ffcc00;
            color: #000;
        }

        .status.in-progress {
            background-color: #007bff;
            color: #fff;
        }

        .status.resolved {
            background-color: #28a745;
            color: #fff;
        }

        .status.rejected {
            background-color: #dc3545;
            color: #fff;
        }

        .actions button {
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
            font-size: 14px;
        }

        .actions .resolve {
            background-color: #28a745;
            color: white;
        }

        .actions .reject {
            background-color: #dc3545;
            color: white;
        }

        .footer-container {
            background-color: rgb(99,102,106);
            color: #ffffff; 
            text-align: center;
            padding: 10px 0; 
            margin-top: auto;
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <div class="navbar">
        <div class="navbar-logo">
            <img src="../../assets/nmims_logo.jpg" alt="NMIMS Logo">
        </div>
        <div class="logout">
            <a href="../login.php">Logout</a>
        </div>
    </div>

    <!-- Dashboard Container -->
    <div class="dashboard-container">
        <h1>Admin Dashboard</h1>
        <p>Welcome, <span id="adminRole"></span></p>
        
        <!-- Complaint List -->
        <div class="complaint-list">
            <h2>Complaints</h2>
            <div id="complaints">
                <!-- Complaints will be dynamically populated here -->
            </div>
        </div>
    </div>

    <footer>
        <div class="footer-container">
            <span>2025 &copy;  STME All rights reserved.</span>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js"></script>
    <script src="admin-dashboard.js"></script>
</body>
</html>
